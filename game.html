<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Juego | DQ GAMEPLAYS</title><link rel="stylesheet" href="styles.css?v=4"></head>
<body><header class="header"><div class="wrap nav"><a class="logo" href="index.html"><span>G</span> DQ GAMEPLAYS</a><a class="back" href="index.html">← Volver</a></div></header>
<main class="wrap detail" id="game"></main><footer><div class="wrap">DQ GAMEPLAYS · Información y enlaces de juegos</div></footer>
<script src="app.js?v=4"></script><script>
(async()=>{const d=await loadData(),id=new URLSearchParams(location.search).get('id'),g=d.games.find(x=>x.id===id),r=document.getElementById('game');
if(!g){r.innerHTML='<div class="empty"><h1>Juego no encontrado</h1><a class="btn" href="index.html">Volver</a></div>';return}
document.title=`${g.name} ${g.version} | DQ GAMEPLAYS`;
r.innerHTML=`<section class="game-image-wrap"><img class="game-image" src="${esc(g.image||'')}" alt="${esc(g.name)} ${esc(g.version)}"></section>
<section class="detail-top"><div><p class="eyebrow">${esc(g.platform)} · ${esc(g.category)}</p><h1>${esc(g.name)} <strong>${esc(g.version)}</strong></h1><p class="lead">${esc(g.short)}</p></div></section>
<section class="info"><h2>¿Qué es ${esc(g.name)}?</h2><p>${esc(g.description)}</p></section>
<section class="info"><h2>¿Qué trae la versión ${esc(g.version)}?</h2><ul>${g.features.map(x=>`<li>✓ ${esc(x)}</li>`).join('')}</ul></section>
<section class="info"><h2>Enlaces</h2><p class="muted">Selecciona una de las opciones disponibles.</p><div class="links">${g.links.map(x=>`<a class="btn" target="_blank" rel="noopener noreferrer" href="${esc(x.url)}">${esc(x.label)} ↗</a>`).join('')}</div></section>`})();
</script></body></html>
